sonar.projectKey=evat-api
sonar.projectName=EVAT API (Chameleon)
sonar.sourceEncoding=UTF-8

sonar.sources=src,server.ts
sonar.tests=test
sonar.test.inclusions=test/**/*.test.ts

# Exclusions (explained in the report):
#  - src/src is a stale duplicate copy of src that server.ts never imports;
#    scanning it would double every issue and inflate duplication to ~50%.
#  - src/types are ambient type declarations with no runtime logic.
sonar.exclusions=src/src/**,src/types/**,**/*.js,build/**,dist/**,node_modules/**
# Models/DTOs are schema declarations, excluded from coverage (not from analysis)
sonar.coverage.exclusions=src/models/**,src/dtos/**,src/config/**,src/routes/**,server.ts

sonar.javascript.lcov.reportPaths=reports/coverage/lcov.info
sonar.typescript.tsconfigPaths=tsconfig.build.json
sonar.qualitygate.wait=false
