route:
  receiver: team-webhook
  group_by: [alertname]
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 1h

receivers:
  - name: team-webhook
    webhook_configs:
      - url: http://alert-receiver:8080/alerts
        send_resolved: true
    # __DISCORD_CONFIG__ injected by Jenkins from the 'discord-webhook' credential.

