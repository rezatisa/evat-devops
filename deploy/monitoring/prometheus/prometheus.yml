global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: evat-api-prod
    metrics_path: /metrics
    static_configs:
      - targets: ["evat-prod-api:8080"]
        labels:
          env: prod
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
