jenkins:
  systemMessage: "EVAT API CI/CD - Build, Test, Code Quality, Security, Deploy, Release, Monitoring"
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          password: "${JENKINS_ADMIN_PASSWORD:-admin}"
  authorizationStrategy: loggedInUsersCanDoAnything

credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              scope: GLOBAL
              id: "sonar-token"
              description: "SonarQube analysis token"
              secret: "${SONAR_TOKEN:-set-me-by-running-sonar-setup}"
          - string:
              scope: GLOBAL
              id: "evat-jwt-staging"
              description: "JWT secret - staging"
              secret: "${JWT_SECRET_STAGING:-staging-change-me}"
          - string:
              scope: GLOBAL
              id: "evat-jwt-prod"
              description: "JWT secret - production"
              secret: "${JWT_SECRET_PROD:-prod-change-me}"

unclassified:
  location:
    url: "http://localhost:8080/"
  sonarGlobalConfiguration:
    buildWrapperEnabled: true
    installations:
      - name: "SonarQube"
        serverUrl: "http://sonarqube:9000"
        credentialsId: "sonar-token"
